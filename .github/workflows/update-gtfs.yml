name: Aggiorna dati ACTV

on:
  schedule:
    - cron: "30 3 * * *"   # ogni giorno alle 03:30 UTC
  workflow_dispatch:         # si può anche lanciare a mano dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica e ricostruisci i dati
        run: python tools/update_from_web.py .
      - name: Salva solo se è cambiato qualcosa
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add actv-data.js times
          if git diff --staged --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Aggiorna dati ACTV"
            git push
          fi
